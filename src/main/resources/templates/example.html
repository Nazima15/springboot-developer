<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf Example</title>
</head>
<body>
<h1>안녕하세요~~ <span th:text="${name}"></span></h1>

<table>
    <tr th:each="item : ${articles}">
        <td th:text="${item.title}"></td>
        <td th:text="${item.content}"></td>
    </tr>
</table>

<div th:object="${person}">
    <p th:text="|이름: *{name}|"></p>
    <p th:text="|나이: *{age}|"></p>
    <p th:text="|아이디: *{id}|"></p>
    <ul>
        <li th:each="hobby : *{hobbies}" th:text="|취미 : ${hobby}|"></li>
    </ul>
</div>

<div th:if="${error != null}">
    에러가 발생했습니다
</div>

<div th:unless="${error != null}">
    정상 작동 중
</div>
<div>
    <p th:text="${#temporals.format(today, 'MM-dd-yyyy')}"></p>
</div>
</body>
</html>
